# ponytail: only the stores an epic already needs. Redis arrives with epic 3, MinIO with epic 6, Gitea with epic 5.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: noon
      POSTGRES_PASSWORD: noon-dev-only
      POSTGRES_DB: noon
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noon -d noon"]
      interval: 2s
      timeout: 2s
      retries: 30
  # One-shot, as the database OWNER: applies migrations and provisions the app's limited login role.
  migrate:
    build: .
    command: ["node", "packages/db/src/migrate-cli.ts"]
    environment:
      MIGRATE_DATABASE_URL: postgres://noon:noon-dev-only@postgres:5432/noon
      APP_DB_ROLE: noon_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-noon-app-dev-only}
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    command: ["node", "apps/api/src/main.ts"]
    environment:
      PORT: "3000"
      # The app connects as noon_app: data access only, not a superuser, cannot alter the schema.
      DATABASE_URL: postgres://noon_app:${APP_DB_PASSWORD:-noon-app-dev-only}@postgres:5432/noon
    ports: ["${API_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # node:24-slim has no curl; Node's own fetch does the job.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pgdata:
