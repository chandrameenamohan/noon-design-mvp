# ponytail: only the stores an epic already needs. MinIO arrives with epic 6, Gitea with epic 5.
#
# Secrets: there are NO default passwords here. `./init.sh` generates random ones into .env (git-ignored),
# and compose refuses to start when one is missing, instead of quietly using a password from a public repo.
# Ports are published on 127.0.0.1 only: a laptop on a shared network must not expose its database.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: noon
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run ./init.sh to generate .env}"
      POSTGRES_DB: noon
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noon -d noon"]
      interval: 2s
      timeout: 2s
      retries: 30
  # Queues now (epic 3); rate limits and leases later. NOT durable on purpose: no volume, no AOF. The
  # Postgres `jobs` table is the truth and the worker re-queues from it, so losing Redis loses nothing.
  redis:
    image: redis:7
    # noeviction: BullMQ breaks if Redis silently drops its keys under memory pressure.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run ./init.sh}", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?run ./init.sh}" # for the healthcheck only
    # 6380 on the host: developer machines tend to have a Redis of their own on 6379.
    ports: ["127.0.0.1:${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  # One-shot, as the database OWNER: applies migrations and provisions the app's limited login role.
  migrate:
    build: .
    command: ["node", "packages/db/src/migrate-cli.ts"]
    environment:
      MIGRATE_DATABASE_URL: "postgres://noon:${POSTGRES_PASSWORD:?run ./init.sh}@postgres:5432/noon"
      APP_DB_ROLE: noon_app
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?run ./init.sh}"
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    command: ["node", "apps/api/src/main.ts"]
    environment:
      PORT: "3000"
      # Development only: lets a caller name themselves with the x-dev-user header (SPEC §2.16).
      # Unset, the api behaves as production and answers 401 to everything until epic 8.
      NODE_ENV: development
      SESSION_TOKEN_SECRET: "${SESSION_TOKEN_SECRET:?run ./init.sh}"
      # What a BROWSER on this machine dials to reach the sync server (which arrives in epic 2).
      SYNC_PUBLIC_URL: "ws://localhost:${SYNC_PORT:-3001}"
      # The app connects as noon_app: data access only, not a superuser, cannot alter the schema.
      # init.sh generates hex passwords, so the value is safe inside a URL without escaping.
      DATABASE_URL: "postgres://noon_app:${APP_DB_PASSWORD:?run ./init.sh}@postgres:5432/noon"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?run ./init.sh}@redis:6379"
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      # Readiness, not liveness: "healthy" must mean the api can reach its database.
      # node:24-slim has no curl; Node's own fetch does the job.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  # One room per open document. A single process until epic 7 adds leases and a second node.
  sync:
    build: .
    command: ["node", "apps/sync/src/main.ts"]
    environment:
      PORT: "3001"
      DATABASE_URL: "postgres://noon_app:${APP_DB_PASSWORD:?run ./init.sh}@postgres:5432/noon"
      SESSION_TOKEN_SECRET: "${SESSION_TOKEN_SECRET:?run ./init.sh}"
    ports: ["127.0.0.1:${SYNC_PORT:-3001}:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  # Long-running work, one BullMQ queue per kind (`ai` now; git, ship and sandbox in later epics).
  worker:
    build: .
    command: ["node", "apps/worker/src/main.ts"]
    environment:
      DATABASE_URL: "postgres://noon_app:${APP_DB_PASSWORD:?run ./init.sh}@postgres:5432/noon"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?run ./init.sh}@redis:6379"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      # No port to ask: main.ts touches this file while its queue connection is alive.
      test: ["CMD", "node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/worker-alive').mtimeMs < 15000 ? 0 : 1)"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pgdata:
