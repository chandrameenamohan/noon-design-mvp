# ponytail: only the stores an epic already needs. MinIO arrives with epic 6.
#
# Secrets: there are NO default passwords here. `./init.sh` generates random ones into .env (git-ignored),
# and compose refuses to start when one is missing, instead of quietly using a password from a public repo.
# Ports are published on 127.0.0.1 only: a laptop on a shared network must not expose its database.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: noon
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run ./init.sh to generate .env}"
      POSTGRES_DB: noon
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noon -d noon"]
      interval: 2s
      timeout: 2s
      retries: 30
  # Queues now (epic 3); rate limits and leases later. NOT durable on purpose: no volume, no AOF. The
  # Postgres `jobs` table is the truth and the worker re-queues from it, so losing Redis loses nothing.
  redis:
    image: redis:7
    # noeviction + a ceiling: when full, Redis REFUSES writes (the api still answers, the sweep retries)
    # rather than dropping BullMQ's keys or growing until the host kills it.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run ./init.sh}", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?run ./init.sh}" # for the healthcheck only
    # 6380 on the host: developer machines tend to have a Redis of their own on 6379.
    ports: ["127.0.0.1:${REDIS_PORT:-6380}:6379"]
    healthcheck:
      # redis-cli exits 0 on an ERROR reply too (measured with a wrong password): only the word PONG is health.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30
  # E5.1: the local git host (SPEC §2.12). ./init.sh makes its user `noon` (`admin` is reserved), the token,
  # the private repo noon/sample-app with the seed in it, and the push webhook to the api. The worker is its
  # only reader inside compose; sandboxes never reach it (their networks are --internal, noon-9gz).
  gitea:
    image: gitea/gitea:1.24
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true" # no install page: init.sh makes the user from the CLI
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: "http://localhost:${GITEA_PORT:-3002}/"
      GITEA__server__DISABLE_SSH: "true" # HTTP only, with the token
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      # Gitea delivers webhooks to external hosts only by default: the api, and nothing else, may be dialled.
      GITEA__webhook__ALLOWED_HOST_LIST: api
    # 3002 on the host: 3000 and 3001 are the api's and sync's.
    ports: ["127.0.0.1:${GITEA_PORT:-3002}:3000"]
    volumes: ["giteadata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60
  # One-shot, as the database OWNER: applies migrations and provisions the app's limited login role.
  migrate:
    build: .
    command: ["node", "packages/db/src/migrate-cli.ts"]
    environment:
      MIGRATE_DATABASE_URL: "postgres://noon:${POSTGRES_PASSWORD:?run ./init.sh}@postgres:5432/noon"
      APP_DB_ROLE: noon_app
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?run ./init.sh}"
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    command: ["node", "apps/api/src/main.ts"]
    environment:
      PORT: "3000"
      # Development only: lets a caller name themselves with the x-dev-user header (SPEC §2.16).
      # Unset, the api behaves as production and answers 401 to everything until epic 8.
      NODE_ENV: development
      SESSION_TOKEN_SECRET: "${SESSION_TOKEN_SECRET:?run ./init.sh}"
      # What a BROWSER on this machine dials to reach the sync server (which arrives in epic 2).
      # Hosting: SYNC_PUBLIC_URL=wss://<public host>/sync, set in the shell, not .env (init.sh smoke-tests locally).
      SYNC_PUBLIC_URL: "${SYNC_PUBLIC_URL:-ws://localhost:${SYNC_PORT:-3001}}"
      # Hosting, too: PREVIEW_PUBLIC_URL=https://<public host>, and the canvas frames the preview through
      # Vite's /preview/ proxy (started with PUBLIC_HOST). Empty: the sandbox proxy's loopback address.
      PREVIEW_PUBLIC_URL: "${PREVIEW_PUBLIC_URL:-}"
      # The app connects as noon_app: data access only, not a superuser, cannot alter the schema.
      # init.sh generates hex passwords, so the value is safe inside a URL without escaping.
      DATABASE_URL: "postgres://noon_app:${APP_DB_PASSWORD:?run ./init.sh}@postgres:5432/noon"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?run ./init.sh}@redis:6379"
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      # Readiness, not liveness: "healthy" must mean the api can reach its database.
      # node:24-slim has no curl; Node's own fetch does the job.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  # One room per open document. A single process until epic 7 adds leases and a second node.
  sync:
    build: .
    command: ["node", "apps/sync/src/main.ts"]
    environment:
      PORT: "3001"
      DATABASE_URL: "postgres://noon_app:${APP_DB_PASSWORD:?run ./init.sh}@postgres:5432/noon"
      SESSION_TOKEN_SECRET: "${SESSION_TOKEN_SECRET:?run ./init.sh}"
    ports: ["127.0.0.1:${SYNC_PORT:-3001}:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  # Long-running work, one BullMQ queue per kind (`ai` now; git, ship and sandbox in later epics).
  worker:
    build: .
    command: ["node", "apps/worker/src/main.ts"]
    environment:
      DATABASE_URL: "postgres://noon_app:${APP_DB_PASSWORD:?run ./init.sh}@postgres:5432/noon"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?run ./init.sh}@redis:6379"
      # The AI peer joins documents like any other peer: it signs its own session (actor = agent)
      # with the secret the sync server verifies, and dials sync INSIDE the Docker network.
      SESSION_TOKEN_SECRET: "${SESSION_TOKEN_SECRET:?run ./init.sh}"
      SYNC_URL: "ws://sync:3001"
      # The owner's `claude setup-token` value, from .env. Optional: without it every AI run fails at
      # once as `token_missing`. ANTHROPIC_API_KEY must NOT be set here: the worker refuses to start.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      AI_MODEL: "${AI_MODEL:-claude-opus-5}"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      sync: { condition: service_healthy }
    healthcheck:
      # No port to ask: main.ts touches this file while its queue connection is alive.
      test: ["CMD", "node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/worker-alive').mtimeMs < 15000 ? 0 : 1)"]
      interval: 2s
      timeout: 2s
      retries: 30
  # E4.2b: the sandbox queue, one container per open document's preview. The ONLY service that holds
  # the Docker socket, which is root on the host: it runs no model and no customer code, only docker
  # commands for sandboxes (the sandboxes themselves run on their own network, never this one).
  # Never merge it with `worker`: that one runs the Agent SDK's subprocess (E4.2a security review).
  # ponytail: the raw socket. A socket proxy that filters by API section does not narrow it (containers
  # create + exec is still root on the host: `run --privileged -v /:/host`); an authz plugin allowing
  # exactly sandbox.ts's calls and flags does. Before anything but our own code can reach this service.
  worker-sandbox:
    build: .
    command: ["node", "apps/worker/src/main.ts"]
    user: root # the socket inside the VM belongs to root
    environment:
      WORKER_QUEUE: sandbox
      DATABASE_URL: "postgres://noon_app:${APP_DB_PASSWORD:?run ./init.sh}@postgres:5432/noon"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?run ./init.sh}@redis:6379"
      # It follows each document as a silent peer: its own session, signed with the sync server's secret.
      SESSION_TOKEN_SECRET: "${SESSION_TOKEN_SECRET:?run ./init.sh}"
      SYNC_URL: "ws://sync:3001"
      SANDBOX_IMAGE: noon-sandbox:dev # built on the host by ./init.sh (or `make sandbox-image`)
      # This stack's sandboxes, and the only ones its reaper removes: `make clean-clone` and the test
      # suites run their own sandboxes on the same Docker daemon.
      SANDBOX_POOL: "${COMPOSE_PROJECT_NAME:-noon-design-mvp}"
      # The pool's sandbox proxy, on the host's 127.0.0.1: every preview of this stack answers there, and
      # the canvas's dev server forwards /preview/ to it (noon-9gz). One per stack: e2e and clean-clone move theirs.
      SANDBOX_PROXY_PORT: "${SANDBOX_PROXY_PORT:-20000}"
      # Every sandbox's clone (E5.1): fetched by THIS service, handed to the sandbox as a bundle.
      SEED_REPO: http://gitea:3000/noon/sample-app.git
      # Not `:?`: compose reads the whole file for every command, and init.sh starts Postgres before the token exists.
      GITEA_TOKEN: "${GITEA_TOKEN:-}"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on:
      gitea: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      sync: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/worker-alive').mtimeMs < 15000 ? 0 : 1)"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pgdata:
  giteadata:
